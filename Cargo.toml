[package]
name = "copycraft"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "Copycraft"
identifier = "com.github.marcelkoopman.copycraft"
icon = ["assets/icon.icns"]
version = "0.1.0"
category = "Utilities"
short_description = "Clipboard transformer"
long_description = "A macOS menubar app that transforms clipboard content into another format, for example JSON formatting."

[package.metadata.bundle.macos]
minimum_system_version = "10.13"
info_plist_entries = { LSUIElement = true }

[dependencies]
arboard = "3"
serde_json = "1"
serde_yaml = "0.9"
tray-icon = "0.25"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSAttributedString"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSResponder",
    "NSScrollView",
    "NSText",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
