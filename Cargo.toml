[package]
name = "copycraft"
version = "0.1.16"
edition = "2024"

[package.metadata.bundle]
name = "Copycraft"
identifier = "com.github.marcelkoopman.copycraft"
icon = ["assets/icon.icns"]
version = "0.1.16"
category = "Utilities"
short_description = "Clipboard transformer"
long_description = "A macOS menubar app that transforms clipboard content into another format, for example JSON formatting."

[package.metadata.bundle.macos]
minimum_system_version = "10.13"
info_plist_entries = { LSUIElement = true }

[dependencies]
anyhow = "1.0.104"
arboard = "3"
base64 = "0.23"
compression-prompt = "0.1.2"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
polars = { version = "0.55.2", default-features = false, features = ["csv", "json", "fmt", "dtype-slim"] }
redact-core = "0.12"
serde_json = "1"
serde_yaml = "0.9"
tray-icon = "0.25"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSAttributedString", "NSArray", "NSURL", "NSUserDefaults", "NSData", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAnimation",
    "NSAnimationContext",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSPasteboard",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageCell",
    "NSImageRep",
    "NSImageView",
    "NSResponder",
    "NSSavePanel",
    "NSScrollView",
    "NSText",
    "NSTextContainer",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNRequestHandler", "VNObservation", "VNRequest", "VNTypes"] }
